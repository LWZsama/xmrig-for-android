name: Auto Update XMRig

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check latest releases from upstream
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATE_XMRIG=$(curl -s https://api.github.com/repos/xmrig/xmrig/releases/latest | jq -r '.tag_name // empty')
          if [ -z "$LATE_XMRIG" ] || [ "$LATE_XMRIG" == "null" ]; then
            LATE_XMRIG=$(git ls-remote --tags https://github.com/xmrig/xmrig.git | grep "refs/tags/v" | grep -v "\^{}" | awk '{print $2}' | sed 's#refs/tags/##' | sort -V | tail -n 1)
          fi

          LATE_XMRIG_MO=$(git ls-remote --tags https://github.com/MoneroOcean/xmrig.git | grep "refs/tags/v" | grep -v "\^{}" | awk '{print $2}' | sed 's#refs/tags/##' | sort -V | tail -n 1)

          CURR_XMRIG=$(grep 'version=' xmrig/lib-builder/script/xmrig-fetch.sh | cut -d'"' -f2)
          CURR_XMRIG_MO=$(grep 'version=' xmrig/lib-builder/script/xmrig-mo-fetch.sh | cut -d'"' -f2)

          echo "Current XMRig: $CURR_XMRIG | Latest XMRig: $LATE_XMRIG"
          echo "Current XMRig-MO: $CURR_XMRIG_MO | Latest XMRig-MO: $LATE_XMRIG_MO"

          echo "curr_xmrig=$CURR_XMRIG" >> $GITHUB_OUTPUT
          echo "late_xmrig=$LATE_XMRIG" >> $GITHUB_OUTPUT
          echo "curr_xmrig_mo=$CURR_XMRIG_MO" >> $GITHUB_OUTPUT
          echo "late_xmrig_mo=$LATE_XMRIG_MO" >> $GITHUB_OUTPUT

          if [ "$CURR_XMRIG" != "$LATE_XMRIG" ] || [ "$CURR_XMRIG_MO" != "$LATE_XMRIG_MO" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Attempt Patch Application & Trigger Release Build
        if: steps.check_version.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATE_XMRIG: ${{ steps.check_version.outputs.late_xmrig }}
          LATE_XMRIG_MO: ${{ steps.check_version.outputs.late_xmrig_mo }}
          CURR_XMRIG: ${{ steps.check_version.outputs.curr_xmrig }}
          CURR_XMRIG_MO: ${{ steps.check_version.outputs.curr_xmrig_mo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update version strings in scripts
          sed -i "s/version=\"${CURR_XMRIG}\"/version=\"${LATE_XMRIG}\"/g" xmrig/lib-builder/script/xmrig-fetch.sh
          sed -i "s/version=\"${CURR_XMRIG_MO}\"/version=\"${LATE_XMRIG_MO}\"/g" xmrig/lib-builder/script/xmrig-mo-fetch.sh

          # Clone latest xmrig and test patch application
          mkdir -p /tmp/xmrig-upstream
          git clone --depth 1 --branch "$LATE_XMRIG" https://github.com/xmrig/xmrig.git /tmp/xmrig-upstream

          PATCH_SUCCESS=true
          PATCH_LOG="/tmp/patch.log"

          if ! patch -p1 -d /tmp/xmrig-upstream < xmrig/lib-builder/xmrig.patch > "$PATCH_LOG" 2>&1; then
            PATCH_SUCCESS=false
          fi

          if [ "$PATCH_SUCCESS" = true ]; then
            echo "Patch applied cleanly for $LATE_XMRIG!"
            
            # Commit directly to main to trigger build and release workflow
            git checkout main
            git add xmrig/lib-builder/script/xmrig-fetch.sh xmrig/lib-builder/script/xmrig-mo-fetch.sh xmrig/lib-builder/xmrig.patch
            git commit -m "chore(xmrig): auto-update XMRig to $LATE_XMRIG and XMRig-MO to $LATE_XMRIG_MO"
            git push origin main

            # Trigger the Build and Release APK workflow
            gh workflow run "Build and Release APK" || true

          else
            echo "Patch failed to apply for $LATE_XMRIG"
            DETAILS=$(cat "$PATCH_LOG")
            gh issue create \
              --title "Auto-update failed: XMRig patch conflict on $LATE_XMRIG" \
              --body "New upstream release detected:
              - XMRig: \`$LATE_XMRIG\`
              - XMRig-MO: \`$LATE_XMRIG_MO\`

              **Patch Application Log:**
              \`\`\`
              $DETAILS
              \`\`\`

              Please update \`xmrig/lib-builder/xmrig.patch\` manually to resolve conflicts." || true
          fi
