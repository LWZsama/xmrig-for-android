name: Build and Release APK

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache
          variant: ccache
          save-always: true
          max-size: "2G"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/27*
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: python3 -m pip install setuptools

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/ndk/r21e
          key: ${{ runner.os }}-ndk-r21e

      - name: Set up Android NDK
        id: setup_ndk
        uses: nttld/setup-ndk@v1.2.0
        with:
          ndk-version: r21e

      - name: Set up JDK 17
        id: setup_java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install

      - name: Update version numbers
        run: node update_version.js

      - name: Build XMRig, libUV, OpenSSL & hwloc
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          cd xmrig/lib-builder
          mkdir -p build/src build/build
          make all
          cd ../..

      - name: Build Android Bundle (AAB)
        env:
          JAVA_HOME: ${{ steps.setup_java.outputs.path }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean :app:bundleRelease --no-daemon --stacktrace --info
          cd ..

      - name: Install bundletool and generate Universal APK
        run: |
          mkdir -p /tmp/bundletool
          curl -L -o /tmp/bundletool/bundletool.jar https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar
          keytool -genkey -v -keystore /tmp/release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=XMRig for Android,O=XMRig,C=US"
          java -jar /tmp/bundletool/bundletool.jar build-apks --mode=universal --bundle=./android/app/build/outputs/bundle/release/app-release.aab --output=./android/app/build/outputs/bundle/release/app-release.apks --ks=/tmp/release.keystore --ks-pass=pass:android --ks-key-alias=androiddebugkey --key-pass=pass:android
          unzip -o ./android/app/build/outputs/bundle/release/app-release.apks -d /tmp/apks
          mv /tmp/apks/universal.apk ./android/app/build/outputs/bundle/release/xmrig-for-android.apk
          mv ./android/app/build/outputs/bundle/release/app-release.aab ./android/app/build/outputs/bundle/release/xmrig-for-android.aab

      - name: Get current version tag
        id: get_tag
        run: |
          VERSION=$(grep '"version"' package.json | cut -d'"' -f4)
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: XMRig for Android ${{ steps.get_tag.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            ./android/app/build/outputs/bundle/release/xmrig-for-android.apk
            ./android/app/build/outputs/bundle/release/xmrig-for-android.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
